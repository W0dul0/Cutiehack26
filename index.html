
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vanilla Vercel App</title>

<body>
  <h1>Alice in Wonderland Hologram</h1>

   <div id = "webcam-web">

      <div id="debug-panel">
        <h2>Debug Panel</h2>
        <button id="hide-button">Hide</button>
        <p>Connection: <span id="net-status">Disconnected</span></p>

      </div>
      <!-- Webcam controls -->
      <video id="webcam" autoplay playsinline muted></video>
   </div>

  <div id="Three.js" style="width: 980px; height: 980px;"></div>

  <script type="module" src="./js/main.js"></script>
