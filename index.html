<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vanilla Vercel App</title>
  <link rel="stylesheet" href="./css/styles.css" />
</head>

<body>
  <h1 class="header">Alice in Wonderland Hologram</h1>

   <div id = "webcam-web">
    <!-- Debug panel -->
      <div id="debug-panel">
        <div class="card">
          <h2 id="header">Debug Panel</h2>
          <button id="hide-button">Hide</button>
        </div>
        <div class="card">
          <p>Connection: <span id="net-status">Disconnected</span></p>
          <p>Coordinates: <span id="telemetry">X: 0° | Y: 0°</span></p>
        </div>
      </div>
      <!-- Divider line with collapse button pinned to its top-left -->
      <div id="line">
        <button id="collapse" aria-label="Collapse debug panel" title="Collapse panel">&#10094;</button>
      </div>
      <!-- Webcam controls -->
      <video id="webcam" autoplay playsinline muted></video>
   </div>

  <div id="Three.js" style="width: 980px; height: 980px;"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs"
  }
}
</script>
<script type="module" src="main.js"></script>
  
</body>
</html>
